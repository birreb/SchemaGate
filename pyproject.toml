[project]
name = "schemagate"
version = "0.1.0"
description = "Extract documents into rows that match your PostgreSQL schema."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.3.0",
    "asyncpg>=0.31.0",
    "charset-normalizer>=3.5.1",
    "fastapi>=0.115",
    "ollama>=0.6.2",
    "openai>=3.6.0",
    "pdf-inspector>=1.17.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.13.0",
    "python-calamine>=0.8.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.32"]
# Local OCR for scanned documents. Separate because ONNX Runtime and PDFium
# add tens of megabytes, and most deployments never see a scan.
ocr = ["onnxruntime>=1.29"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "fpdf2>=2.8.8",
    "httpx2>=2.12",
    "mypy>=1.13",
    "onnxruntime>=1.29.0",
    "openpyxl>=3.1.5",
    "pypdfium2>=5.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a live PostgreSQL instance (set SCHEMAGATE_TEST_DSN)",
    "ocr: requires the ocr extra (onnxruntime and pypdfium2)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.mypy]
# No python_version pin. It exists to reject syntax newer than the floor,
# but CI runs the whole suite on 3.11, which proves that far better than a
# flag does. Pinned to 3.11 here, mypy also cannot parse numpy's stubs,
# which Pillow drags in, and fails before checking any of this project.
strict = true
files = ["src", "tests"]

# Pillow is typed and imports numpy, whose stubs use syntax newer than the
# Python floor this project supports, so mypy cannot even parse them. Pillow
# is a test-only dependency used to draw fixture images, so not following it
# costs nothing and stops the chain before numpy.
[[tool.mypy.overrides]]
module = ["PIL.*", "numpy.*", "onnxruntime.*", "pypdfium2_raw.*", "pypdfium2.*", "pillow_heif.*"]
ignore_missing_imports = true
follow_imports = "skip"
