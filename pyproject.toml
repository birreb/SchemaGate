[project]
name = "schemagate"
version = "0.1.0"
description = "Extract documents into rows that match your PostgreSQL schema."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.32"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx2>=2.12",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a live PostgreSQL instance (set SCHEMAGATE_TEST_DSN)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
