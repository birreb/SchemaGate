[project]
name = "schemagate"
version = "0.1.0"
description = "Extract documents into rows that match your PostgreSQL schema."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["postgres", "schema", "extraction", "llm", "documents", "ocr", "invoices"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]

# The core is the part with no opinion about where a document comes from or
# which model reads it: the schema compiler, the validation gate, and the
# tabular path that never calls a model at all. Everything with a heavyweight
# dependency behind it is an extra, so a service that reads spreadsheets into
# Postgres does not install three model SDKs and an imaging library to do it.
dependencies = [
    "anyio>=4.6",
    "charset-normalizer>=3.5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-calamine>=0.8.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31.0"]
server = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn[standard]>=0.32"]
images = ["pillow>=12.3.0", "pillow-heif>=1.6.0"]
pdf = ["pdf-inspector>=1.17.0", "schemagate[images]"]
# Local OCR for scanned documents. Separate because ONNX Runtime and PDFium
# add tens of megabytes, and most deployments never see a scan.
ocr = ["onnxruntime>=1.29", "pypdfium2>=5.13.0", "schemagate[pdf]"]
anthropic = ["anthropic>=1.3.0"]
openai = ["openai>=3.6.0"]
ollama = ["ollama>=0.6.2"]
all = [
    "schemagate[anthropic]",
    "schemagate[ocr]",
    "schemagate[ollama]",
    "schemagate[openai]",
    "schemagate[postgres]",
    "schemagate[server]",
]

[project.scripts]
schemagate = "schemagate.cli:main"

[project.urls]
Homepage = "https://github.com/birreb/SchemaGate"
Source = "https://github.com/birreb/SchemaGate"
Issues = "https://github.com/birreb/SchemaGate/issues"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "fpdf2>=2.8.8",
    "httpx2>=2.12",
    "matplotlib>=3.11.1",
    "mypy>=1.13",
    "openpyxl>=3.1.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "postgres: requires a live PostgreSQL instance (set SCHEMAGATE_TEST_DSN)",
    "ocr: requires the ocr extra (onnxruntime and pypdfium2)",
]

[tool.coverage.run]
source = ["src/schemagate"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]

[tool.mypy]
# No python_version pin. It exists to reject syntax newer than the floor,
# but CI runs the whole suite on 3.11, which proves that far better than a
# flag does. Pinned to 3.11 here, mypy also cannot parse numpy's stubs,
# which Pillow drags in, and fails before checking any of this project.
strict = true
files = ["src", "tests"]

# Pillow is typed and imports numpy, whose stubs use syntax newer than the
# Python floor this project supports, so mypy cannot even parse them. Pillow
# is a test-only dependency used to draw fixture images, so not following it
# costs nothing and stops the chain before numpy.
[[tool.mypy.overrides]]
module = ["PIL.*", "numpy.*", "onnxruntime.*", "pypdfium2_raw.*", "pypdfium2.*", "pillow_heif.*"]
ignore_missing_imports = true
follow_imports = "skip"
