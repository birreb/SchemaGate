name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.14 is included because uv resolves to it locally. Without it, code
        # written on a developer machine runs on a version CI never exercises.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schemagate
          POSTGRES_PASSWORD: schemagate
          POSTGRES_DB: schemagate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCHEMAGATE_TEST_DSN: postgresql://schemagate:schemagate@localhost:5432/schemagate_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v --cov --cov-report=term-missing

  # The PDF path sets PDFIUM_LIB_PATH and ORT_DYLIB_PATH itself because Windows
  # will not find those libraries on its own. That code existed for a year and
  # ran on no machine CI had ever seen. No Postgres here: service containers are
  # Linux only, and the marked tests skip themselves without a DSN.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Tests
        run: uv run pytest -q

  # Proves the extras are real. Every import that a base install can reach must
  # work with nothing but the core dependencies installed, or the split is a
  # promise the metadata makes and the code breaks.
  minimal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # In a virtualenv, not --system: the runner's Python is externally
      # managed and refuses a system-wide install.
      - name: Install the core alone
        run: |
          uv venv --python 3.12
          uv pip install .

      - name: The library imports and runs without a server or a model
        run: |
          .venv/bin/python - <<'PY'
          import asyncio

          from schemagate import ColumnSpec, TableSchema, process

          table = TableSchema(
              schema="public",
              name="invoices",
              columns=(ColumnSpec(name="invoice_number", data_type="text", nullable=False, ordinal=1),),
          )
          result = asyncio.run(
              process(b"invoice_number\nINV-1\n", "invoices.csv", table, extractor=None)
          )
          assert result.rows[0]["invoice_number"] == "INV-1", result
          assert result.spend.calls == 0
          print("core install extracts a CSV with no extras present")
          PY

      - name: A missing extra says which extra installs it
        run: |
          .venv/bin/python - <<'PY'
          from schemagate.errors import MissingDependencyError
          from schemagate.optional import require

          for module, extra in (("pdf_inspector", "pdf"), ("anthropic", "anthropic")):
              try:
                  require(module)
              except MissingDependencyError as error:
                  assert f"schemagate[{extra}]" in str(error), error
                  print(f"{module}: {error}")
              else:
                  raise SystemExit(f"{module} should not be installed in a core install")
          PY

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the distributions
        run: uv build

      - name: Check the metadata PyPI will read
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
