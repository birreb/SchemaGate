<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchemaGate</title>
<style>
  /* Committed to one look rather than following the viewer's theme. This page is
     a demonstration surface, and a deliberate look reads better than a
     compromise between two. Monochrome throughout: the only colour on the page
     marks something that did not hold. */
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --ink: #ededed;
    --dim: #8a8a8a;
    --faint: #5a5a5a;
    --line: #1c1c1c;
    --edge: #2c2c2c;
    --flag: #c8a45c;
    --bad: #c76a5e;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  main { max-width: 940px; margin: 0 auto; padding: 88px 32px 140px; }
  [hidden] { display: none !important; }

  header { margin-bottom: 76px; }
  h1 {
    margin: 0 0 10px;
    font-size: 15px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
  }
  header p { margin: 0; max-width: 46ch; color: var(--dim); font-size: 14px; }

  /* Label left, count right, hairline under. Repeated for every section and for
     the results, so the page has one structure rather than several. */
  .rule {
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    padding-bottom: 12px; margin-bottom: 24px;
    border-bottom: 1px solid var(--edge);
  }
  .rule > span:first-child {
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
    white-space: nowrap;
  }
  .rule > span:last-child {
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    text-align: right; overflow: hidden; text-overflow: ellipsis;
  }

  section { margin-bottom: 62px; }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 28px; }
  label { display: block; }
  .name {
    display: block; margin-bottom: 10px;
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
  }
  input, select {
    width: 100%; padding: 0 0 9px; border: 0; border-bottom: 1px solid var(--edge);
    border-radius: 0; background: transparent; color: var(--ink);
    font-family: var(--mono); font-size: 13.5px; appearance: none;
  }
  select {
    cursor: pointer; padding-right: 18px;
    background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%),
                      linear-gradient(135deg, var(--faint) 50%, transparent 50%);
    background-position: right 5px top 6px, right 0 top 6px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select option { background: #141414; color: var(--ink); }
  input:focus, select:focus { outline: none; border-bottom-color: var(--ink); }
  input::placeholder { color: var(--faint); }
  .aside { margin: 20px 0 0; font-size: 12.5px; color: var(--faint); max-width: 70ch; }

  #drop {
    border: 1px dashed var(--edge); padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .14s;
  }
  #drop:hover, #drop.over { border-color: var(--dim); }
  #drop p { margin: 0; color: var(--faint); font-size: 13.5px; letter-spacing: .03em; }
  #drop strong { color: var(--ink); font-weight: 500; }
  #chosen { font-family: var(--mono); color: var(--ink) !important; }

  .actions { display: flex; align-items: center; gap: 22px; margin-top: 32px; }
  button {
    padding: 0 0 7px; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0;
    background: none; color: var(--ink); cursor: pointer;
    font: inherit; font-size: 14px; letter-spacing: .03em;
  }
  button::after { content: "  \2192"; }
  button:disabled { color: var(--faint); border-bottom-color: var(--line); cursor: default; }
  .hint { color: var(--faint); font-size: 12.5px; }

  .state { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  .state.ok { color: var(--dim); }
  .state.flagged { color: var(--flag); }
  .state.error { color: var(--bad); }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 13px 20px 13px 0; text-align: left; white-space: nowrap; }
  th {
    font-size: 10px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); border-bottom: 1px solid var(--edge);
  }
  td { border-bottom: 1px solid var(--line); font-family: var(--mono); color: var(--ink); }
  tbody tr:last-child td { border-bottom: 0; }
  .index { width: 1%; padding-right: 28px; color: var(--faint); }
  td.null { color: var(--faint); }
  td.bad { color: var(--flag); }

  .failures { margin-top: 36px; }
  .failure { padding: 18px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .failure:last-child { border-bottom: 0; }
  .failure .where {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--flag); margin-bottom: 7px;
  }
  .failure .what { color: var(--dim); }

  details { margin-top: 44px; }
  summary {
    cursor: pointer; list-style: none; color: var(--faint);
    font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
    padding-bottom: 12px; border-bottom: 1px solid var(--edge);
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "  +"; }
  details[open] summary::after { content: "  \2212"; }
  pre {
    margin: 24px 0 0; padding: 0; background: none; border: 0;
    overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.7;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
  }
  .note { margin-top: 24px; color: var(--faint); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SchemaGate</h1>
    <p>Extract a document into rows that match a Postgres table. Nothing is written.</p>
  </header>

  <section>
    <div class="rule"><span>Destination</span><span id="destination-note"></span></div>
    <div class="fields">
      <label><span class="name">Connection</span><select id="connection"></select></label>
      <label><span class="name">Table</span><select id="table"></select></label>
    </div>
  </section>

  <section>
    <div class="rule"><span>Model</span><span id="model-count"></span></div>
    <div class="fields">
      <label>
        <span class="name">Provider</span>
        <select id="provider">
          <option value="">Server default</option>
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="openai_compatible">OpenAI-compatible</option>
          <option value="ollama">Ollama, local</option>
        </select>
      </label>
      <label id="model-field" hidden><span class="name">Model</span><select id="model"></select></label>
      <label id="key-field" hidden>
        <span class="name">API key</span>
        <input type="password" id="api-key" spellcheck="false" autocomplete="off">
      </label>
      <label id="url-field" hidden>
        <span class="name">Base URL</span>
        <input type="text" id="base-url" spellcheck="false" autocomplete="off">
      </label>
    </div>
    <p class="aside" id="model-note">Spreadsheets and CSV files never reach a model. Only PDFs do.</p>
  </section>

  <section>
    <div class="rule"><span>Document</span><span></span></div>
    <div id="drop" tabindex="0" role="button" aria-label="Choose a file">
      <p id="prompt"><strong>Drop a file</strong> or click to choose</p>
      <p id="chosen" hidden></p>
    </div>
    <div class="actions">
      <button id="run" disabled>Extract</button>
      <span class="hint" id="hint">Choose a file to begin.</span>
    </div>
    <input type="file" id="file" hidden
           accept=".csv,.tsv,.xlsx,.xls,.xlsb,.ods,.pdf,.png,.jpg,.jpeg,.webp,.tiff,.heic">
  </section>

  <section id="result" hidden>
    <div class="rule">
      <span id="status" class="state"></span>
      <span id="meta"></span>
    </div>
    <div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
    <div class="failures" id="failures"></div>
    <p class="note" id="note" hidden></p>
    <details><summary>Response</summary><pre id="raw"></pre></details>
  </section>

  <section id="failed" hidden>
    <div class="rule"><span class="state error">Error</span><span id="code"></span></div>
    <pre id="reason"></pre>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (element, visible) => { element.hidden = !visible; };
  let file = null;

  // What each provider needs, and a placeholder that is a real model name
  // rather than a shape to decipher.
  const PROVIDERS = {
    anthropic: { key: true, url: false, model: "claude-opus-5" },
    openai: { key: true, url: false, model: "gpt-5" },
    openai_compatible: { key: true, url: true, model: "llama-3.3-70b", urlHint: "https://api.groq.com/openai/v1" },
    ollama: { key: false, url: true, model: "qwen3", urlHint: "http://localhost:11434" },
  };

  // The key is kept here and sent with the request. It is never written to the
  // server, and clearing site data removes it.
  const remember = (name, value) => { try { localStorage.setItem("sg." + name, value); } catch {} };
  const recall = (name) => { try { return localStorage.getItem("sg." + name) || ""; } catch { return ""; } };

  const escape = (text) => {
    const node = document.createElement("span");
    node.textContent = text;
    return node.innerHTML;
  };

  // --- destination ---------------------------------------------------------

  const loadConnections = async () => {
    try {
      const { connections } = await (await fetch("/v1/connections")).json();
      $("connection").innerHTML = connections
        .map((name) => `<option value="${escape(name)}">${escape(name)}</option>`).join("");
      const saved = recall("connection");
      if (connections.includes(saved)) $("connection").value = saved;
      await loadTables();
    } catch (error) {
      $("destination-note").textContent = "Could not read the configured connections.";
    }
  };

  const loadTables = async () => {
    const connection = $("connection").value;
    const select = $("table");
    if (!connection) return;
    select.innerHTML = `<option value="">loading…</option>`;
    try {
      const response = await fetch("/v1/tables?connection=" + encodeURIComponent(connection));
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail ?? "could not list tables");

      if (!body.tables.length) {
        select.innerHTML = `<option value="">no readable tables</option>`;
        $("destination-note").textContent = "This connection has no tables the role can read.";
        return refresh();
      }
      select.innerHTML = body.tables.map((t) => {
        const value = `${t.schema}.${t.name}`;
        const label = t.kind === "table" ? value : `${value} · ${t.kind}`;
        return `<option value="${escape(value)}">${escape(label)}</option>`;
      }).join("");
      const saved = recall("table");
      if ([...select.options].some((o) => o.value === saved)) select.value = saved;
      $("destination-note").textContent = `${body.tables.length} readable relations.`;
    } catch (error) {
      select.innerHTML = `<option value="">unavailable</option>`;
      $("destination-note").textContent = String(error.message ?? error);
    }
    refresh();
  };

  // --- model ---------------------------------------------------------------

  const applyProvider = () => {
    const name = $("provider").value;
    const spec = PROVIDERS[name];

    show($("model-field"), Boolean(spec));
    show($("key-field"), Boolean(spec && spec.key));
    show($("url-field"), Boolean(spec && spec.url));

    if (!spec) {
      $("model-note").textContent =
        "Spreadsheets and CSV files never reach a model. Only PDFs do.";
      return refresh();
    }
    $("base-url").placeholder = spec.urlHint ?? "";
    $("api-key").value = recall("key." + name);
    $("base-url").value = recall("url." + name) || (spec.urlHint ?? "");
    loadModels();
    refresh();
  };

  // Asked of the provider rather than hardcoded here, so the list cannot go
  // stale and reflects what this key is actually entitled to.
  let modelRequest = 0;
  const loadModels = async () => {
    const name = $("provider").value;
    const spec = PROVIDERS[name];
    const select = $("model");
    if (!spec) return;

    const ticket = ++modelRequest;
    select.innerHTML = `<option value="">loading…</option>`;

    const form = new FormData();
    form.append("provider", name);
    if ($("api-key").value) form.append("api_key", $("api-key").value);
    if ($("base-url").value.trim()) form.append("base_url", $("base-url").value.trim());

    let body;
    try {
      const response = await fetch("/v1/models", { method: "POST", body: form });
      body = await response.json();
      if (!response.ok) body = { models: [], source: "error", detail: body.detail };
    } catch (error) {
      body = { models: [], source: "error", detail: String(error) };
    }

    // A slower earlier request must not overwrite a newer one.
    if (ticket !== modelRequest) return;

    const saved = recall("model." + name);
    const models = body.models.length ? body.models : (saved ? [saved] : []);

    select.innerHTML = models.length
      ? models.map((m) => `<option value="${escape(m)}">${escape(m)}</option>`).join("")
      : `<option value="">none available</option>`;
    if (models.includes(saved)) select.value = saved;
    else if (models.includes(spec.model)) select.value = spec.model;

    const where = spec.key
      ? "The key stays in this browser and is sent with each request. It is never stored on the server."
      : "Runs on this machine. Nothing leaves your network.";
    const listing = body.source === "provider"
      ? `${models.length} models offered by the provider.`
      : (body.detail ?? "");
    $("model-note").textContent = `${listing} ${where}`.trim();
    refresh();
  };

  // --- running -------------------------------------------------------------

  const refresh = () => {
    const ready = Boolean(file && $("table").value);
    $("run").disabled = !ready;
    $("hint").textContent = file ? (ready ? "" : "Choose a table.") : "Choose a file to begin.";
  };

  const choose = (chosen) => {
    file = chosen;
    show($("prompt"), false);
    const label = $("chosen");
    show(label, true);
    label.textContent = `${chosen.name} · ${(chosen.size / 1024).toFixed(1)} kB`;
    refresh();
  };

  $("drop").addEventListener("click", () => $("file").click());
  $("drop").addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); $("file").click(); }
  });
  $("file").addEventListener("change", () => $("file").files[0] && choose($("file").files[0]));
  ["dragenter", "dragover"].forEach((name) =>
    $("drop").addEventListener(name, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach((name) =>
    $("drop").addEventListener(name, () => $("drop").classList.remove("over")));
  $("drop").addEventListener("drop", (event) => {
    event.preventDefault();
    if (event.dataTransfer.files[0]) choose(event.dataTransfer.files[0]);
  });

  $("connection").addEventListener("change", () => { remember("connection", $("connection").value); loadTables(); });
  $("table").addEventListener("change", () => remember("table", $("table").value));
  $("provider").addEventListener("change", () => { remember("provider", $("provider").value); applyProvider(); });
  $("model").addEventListener("change", () => remember("model." + $("provider").value, $("model").value));

  // Re-list once typing settles, since the key is what decides what is offered.
  let settle;
  const relist = () => { clearTimeout(settle); settle = setTimeout(loadModels, 600); };
  $("api-key").addEventListener("input", () => {
    remember("key." + $("provider").value, $("api-key").value);
    relist();
  });
  $("base-url").addEventListener("input", () => {
    remember("url." + $("provider").value, $("base-url").value);
    relist();
  });

  $("run").addEventListener("click", async () => {
    $("run").disabled = true;
    $("hint").textContent = "Extracting…";
    show($("result"), false);
    show($("failed"), false);

    const [schema, ...rest] = $("table").value.split(".");
    const form = new FormData();
    form.append("file", file);
    form.append("connection", $("connection").value);
    form.append("schema", schema);
    form.append("table", rest.join("."));

    const provider = $("provider").value;
    if (provider) {
      form.append("provider", provider);
      if ($("model").value) form.append("model", $("model").value);
      if ($("api-key").value) form.append("api_key", $("api-key").value);
      if ($("base-url").value.trim()) form.append("base_url", $("base-url").value.trim());
    }

    try {
      const response = await fetch("/v1/extract", { method: "POST", body: form });
      const body = await response.json();
      if (response.ok) render(body); else fail(response.status, body);
    } catch (error) {
      fail("network", { detail: String(error) });
    } finally {
      $("hint").textContent = "";
      refresh();
    }
  });

  const fail = (code, body) => {
    $("code").textContent = code;
    $("reason").textContent = body.detail ?? JSON.stringify(body, null, 2);
    show($("failed"), true);
  };

  const render = (body) => {
    $("raw").textContent = JSON.stringify(body, null, 2);

    const badge = $("status");
    badge.textContent = body.status;
    badge.className = `badge ${body.status}`;

    const timings = Object.entries(body.timings_ms).map(([s, ms]) => `${s} ${ms}ms`).join("  ");
    $("meta").textContent = `${body.table} · ${body.route} · ${body.rows.length} rows · ${timings}`;

    // Mark the cell the gate complained about, so the problem is visible where
    // the value is rather than only in a list underneath.
    const bad = new Set(
      body.validation.failures.filter((f) => f.column !== null).map((f) => `${f.row}:${f.column}`)
    );

    const columns = body.rows.length ? Object.keys(body.rows[0]) : [];
    $("head").innerHTML = columns.length
      ? `<tr>${columns.map((n) => `<th>${escape(n)}</th>`).join("")}</tr>` : "";
    $("body").innerHTML = body.rows.map((row, index) =>
      `<tr>${columns.map((n) => cell(row[n], bad.has(`${index}:${n}`))).join("")}</tr>`
    ).join("");

    $("failures").innerHTML = body.validation.failures.map((f) => `
      <div class="failure">
        <div class="where">row ${f.row}${f.column ? ` · ${escape(f.column)}` : ""} · ${escape(f.rule)}</div>
        ${escape(f.detail)}
      </div>`).join("");

    const notes = [];
    if (body.unmatched_headers.length)
      notes.push(`Ignored columns not in the table: ${body.unmatched_headers.join(", ")}.`);
    if (body.missing_columns.length)
      notes.push(`The file had no column for: ${body.missing_columns.join(", ")}.`);
    $("note").textContent = notes.join(" ");
    show($("note"), notes.length > 0);

    show($("result"), true);
  };

  const cell = (value, flagged) => {
    const classes = [flagged ? "bad" : "", value === null ? "null" : ""].filter(Boolean).join(" ");
    return `<td class="${classes}">${escape(value === null ? "null" : String(value))}</td>`;
  };

  $("provider").value = recall("provider");
  applyProvider();
  loadConnections();
</script>
</body>
</html>
